<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styl.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+DE+SAS+Guides&family=Rationale&family=Sansation:ital,wght@0,300;0,500;0,700;1,300;1,500;1,700&family=Vend+Sans:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <title>WeatherApp</title>
  </head>
  <body>
    <header class="clock-number">
      <div class="clock">
        <div class="namber namber12">12</div>
        <div class="namber namber3">3</div>
        <div class="namber namber6">6</div>
        <div class="namber namber9">9</div>
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
        <div class="center-dot"></div>
      </div>
    </header>
    <form class="input-search" id="search-form">
      <input
        type="search"
        placeholder="Enter a city"
        class="input-city"
        id="search-form-input"
        required
      />
      <input type="submit" value="Search" class="input-submit" />
    </form>

    <main class="container">
      <div class="time" id="weather-app-city"></div>
      <div class="weather-app-deteils">
        <div id="icon"></div>
        <span class="weather-app-temperture" id="temperature"></span>
        <span class="weather-app-unit">°C</span>
        <div>
          <span id="time"></span>
          <span id="description"></span>
        </div>
        <div>
          Humidity <span id="humidity"> </span> wind
          <span id="wind">3,15</span>
        </div>
      </div>

      <div class="forcast" id="forecast"></div>
    </main>
    <footer>
      This project was coded by
      <a
        href="https://github.com/Olesia20"
        target="_blank"
        rel="noopener noreferrer"
      >
        Olesia Kononova</a
      >
      open-sourced on
      <a
        href="https://github.com/Olesia20/new-project"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >
      and hosted on
      <a href="https://incandescent-lily-915ba3.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="src/script.js"></script>
  </body>
</html>
