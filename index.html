<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styl.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+DE+SAS+Guides&family=Rationale&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Vend+Sans:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <title>WeatherApp</title>
  </head>
  <body>
    <header class="clock-number">
      <div class="clock">
        <div class="namber namber12">12</div>
        <div class="namber namber3">3</div>
        <div class="namber namber6">6</div>
        <div class="namber namber9">9</div>
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
        <div class="center-dot"></div>
      </div>
    </header>
    <main class="container">
      <div class="time">17:30</div>
      <div class="day">
        <p>
        <div>Monday</div>
        <br />30/08/2026
    </p>
      </div>
      <div class="forcast">
        <h4>Tue</h4>
        <h4>Wed</h4>
        <h4>Thu</h4>
        <h4>Fri</h4>
        <h4>Sat</h4>
        <h4>Sun</h4>
      </div>
    </main>
    <footer>
      This project was coded by
      <a
        href="https://github.com/Olesia20"
        target="_blank"
        rel="noopener noreferrer"
      >
        Olesia Kononova</a
      >
      open-sourced on
      <a
        href="https://github.com/Olesia20/new-project"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >
    </footer>
    <script src="src/script.js"></script>
  </body>
</html>
